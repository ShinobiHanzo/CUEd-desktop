name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (proto, relay, funnel, audio bindings, daemon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
        env:
          CUED_AUDIO_NULL: "1"
      - run: cargo clippy --workspace -- -D warnings
        continue-on-error: true

  cpp:
    name: C++ audio engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg cmake
      - run: cmake -S native/cued-audio -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure

  python:
    name: Python companion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest websockets
      - run: cd python && python -m pytest -q

  release:
    name: Release binaries
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, cpp, python]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p cuedd -p cued-funnel
      - uses: actions/upload-artifact@v4
        with:
          name: cued-desktop-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/cuedd*
            target/${{ matrix.target }}/release/cued-funnel*
            python/
            !python/**/__pycache__
