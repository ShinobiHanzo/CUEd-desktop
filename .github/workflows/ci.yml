name: CI

# Push a tag like v0.2.1, or run manually with a tag name (created at this
# branch's head if it does not exist yet), to build release archives for Linux,
# macOS and Windows and publish them on the GitHub Releases page.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.2.1 (created at this branch's head if missing). Empty: just run CI."
        required: false
        default: ""
      dry_run:
        description: "Build the release archives for every platform without tagging or publishing anything."
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (proto, relay, funnel, audio bindings, daemon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
        env:
          CUED_AUDIO_NULL: "1"
      - run: cargo clippy --workspace -- -D warnings
        continue-on-error: true

  cpp:
    name: C++ audio engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg cmake
      - run: cmake -S native/cued-audio -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure

  python:
    name: Python companion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest websockets
      - run: cd python && python -m pytest -q

  release:
    name: Release binaries
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != '' || github.event.inputs.dry_run == 'true'
    needs: [rust, cpp, python]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is built on 22.04 on purpose: the binary then runs on anything with glibc 2.35+ (Debian 12, Ubuntu 22.04, Raspberry Pi OS bookworm).
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }} -p cuedd -p cued-funnel
      - name: Package
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          name="cued-desktop-${tag}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/cuedd${{ matrix.ext }}" "target/${{ matrix.target }}/release/cued-funnel${{ matrix.ext }}" "dist/$name/"
          cp -r python docs README.md CHANGELOG.md LICENSE "dist/$name/"
          find "dist/$name" -type d \( -name __pycache__ -o -name .pytest_cache \) -prune -exec rm -rf {} +
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            tar czf "$name.tar.gz" "$name"
            if command -v sha256sum > /dev/null; then sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"; else shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"; fi
          fi
          rm -rf "$name"
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: cued-desktop-${{ matrix.target }}
          path: dist/*

  publish:
    name: Publish GitHub Release
    # Publishes whatever platforms built; one failing target does not hold the others back.
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != '') }}
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: cued-desktop-*
          merge-multiple: true
          path: dist
      - name: Release notes from the changelog
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          ver="${tag#v}"
          {
            echo "## CUEd desktop $tag"
            echo
            echo "The computer-side half of CUEd: pairs with the phone over a QR code, backs it up, streams its library back, runs spotdl downloads, relays Stations through an embedded Nostr relay and is reached from outside through a self-hosted funnel. Protocol in \`docs/protocol.md\`."
            echo
            echo "**Install:** unpack the archive for your platform and run \`cuedd\` (it opens the web UI on http://localhost:8770). \`cued-funnel\` is the edge for reaching it from outside. The Python companion for spotdl downloads is in \`python/\`; see the README."
            echo
            if grep -q "^## $ver" CHANGELOG.md; then
              echo "### Changes"
              awk -v v="$ver" '$0 ~ "^## "v"$" {on=1; next} /^## / {if (on) exit} on' CHANGELOG.md
            fi
            echo
            echo "SHA-256 of each archive is in the matching \`.sha256\` file. Built and tested in CI; the Windows and macOS binaries have not been run on a device yet, so please report what breaks."
          } > notes.md
          cat notes.md
          ls -l dist || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: CUEd desktop ${{ github.event.inputs.tag || github.ref_name }}
          body_path: notes.md
          prerelease: false
          generate_release_notes: true
          files: dist/*
