[package]
name = "cuedd"
description = "CUEd desktop: pairs with the phone over a QR code, syncs, streams and backs up its library, relays its Stations through an embedded Nostr relay, and reaches it from anywhere through a self-hosted funnel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cuedd"
path = "src/main.rs"

[dependencies]
cued-proto = { path = "../cued-proto" }
cued-relay = { path = "../cued-relay" }
cued-funnel = { path = "../cued-funnel" }
cued-audio = { path = "../cued-audio" }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
futures-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
rustls = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
qrcode = { workspace = true, features = ["svg"] }
percent-encoding = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
if-addrs = "0.13"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
open = "5"
mime_guess = "2"
bytes = "1"
http-body-util = "0.1"

[dev-dependencies]
tempfile = "3"
